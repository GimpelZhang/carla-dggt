# E2E Test Configuration
#
# Configuration for end-to-end testing of DGGT-CARLA integration.
#
# Environment:
#   - CARLA server must be running at carla.host:carla.port
#   - DGGT server must be running at dggt_server.host:dggt_server.port
#   - Scene data must be available at scene.dggt_scene_path

carla:
  host: localhost
  port: 2000
  timeout: 10.0

dggt_server:
  host: localhost
  port: 50051
  timeout: 30.0

scene:
  # scene_base_path must match DGGT server's scene_base_path
  # Default server path: /home/junchuan/e2e/dggt/output/waymo/training
  dggt_scene_path: /home/junchuan/e2e/dggt/output/waymo/training
  xodr_map_path: /home/junchuan/e2e/dggt/output/waymo/training/scene1/0328/001/map.xodr
  # scene_id is relative path from scene_base_path to the scene directory
  scene_id: "scene1/0328/001"

test:
  num_frames: 10
  save_images: true
  output_dir: ./test_output/
  compare_reference: false